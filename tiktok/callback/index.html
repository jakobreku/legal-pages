<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reku Media — TikTok Authorization</title>
<meta name="robots" content="noindex">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 640px;
    margin: 80px auto;
    padding: 0 24px;
    color: #111;
  }
  code {
    display: block;
    word-break: break-all;
    background: #f2f2f2;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 16px;
    font-size: 15px;
    margin: 16px 0;
  }
  button {
    font-size: 15px;
    padding: 8px 16px;
    cursor: pointer;
  }
  .error { color: #b00020; }
</style>
</head>
<body>
  <h1>TikTok Authorization</h1>
  <p id="status">Reading authorization result…</p>
  <code id="code" style="display:none"></code>
  <button id="copy" style="display:none">Copy code</button>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");
    const statusEl = document.getElementById("status");
    const codeEl = document.getElementById("code");
    const copyBtn = document.getElementById("copy");

    if (code) {
      statusEl.textContent = "Authorized. Copy this code and paste it into the setup script:";
      codeEl.textContent = code;
      codeEl.style.display = "block";
      copyBtn.style.display = "inline-block";
      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(code);
        copyBtn.textContent = "Copied!";
      });
    } else if (error) {
      statusEl.textContent = "Authorization failed: " + error;
      statusEl.className = "error";
    } else {
      statusEl.textContent = "No authorization code found in the URL.";
      statusEl.className = "error";
    }
  </script>
</body>
</html>
